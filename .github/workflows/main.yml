name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Node
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 3️⃣ Install dependencies
    - name: Install Dependencies
      run: npm ci

    # 4️⃣ Build Next.js
    - name: Build Application
      run: npm run build

    # 5️⃣ Setup SSH
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    # 6️⃣ Deploy to Server
    - name: Deploy Frontend
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/crt-app/frontend"

        rsync -avz --delete \
          .next \
          public \
          package.json \
          package-lock.json \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/crt-app/frontend/

    # 7️⃣ Install Production Dependencies on Server
    - name: Install Production Dependencies
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          cd ~/crt-app/frontend &&
          npm ci --production
        "

    # 8️⃣ Restart PM2 Frontend
    - name: Restart Frontend (PM2)
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          pm2 delete crt-frontend || true
          pm2 start npm --name crt-frontend -- start
          pm2 save
        "

    # 9️⃣ Verify PM2
    - name: Verify PM2
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "pm2 status"
